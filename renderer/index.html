<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claude HQ</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1F1E1D; color: #F4EDE3;
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif; }
    #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #ui > * { pointer-events: auto; }
    #hq-banner { position: fixed; top: 0; left: 0; right: 0; padding: 8px 12px; background: #EF5A4C; color: #1F1E1D;
      font-weight: 600; text-align: center; display: none; z-index: 100; }
    #hq-banner.show { display: block; }
  </style>
</head>
<body>
  <canvas id="view" tabindex="0"></canvas>
  <div id="ui"></div>
  <div id="hq-banner" role="alert"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
